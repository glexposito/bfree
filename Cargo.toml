[package]
name = "bfree"
version = "0.1.7"
edition = "2024"
description = "Human-friendly Linux memory usage."
license = "MIT"
repository = "https://github.com/glexposito/bfree"
readme = "README.md"
keywords = ["memory", "linux", "cli", "system"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
procfs = "0.18"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

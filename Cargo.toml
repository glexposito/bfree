[package]
name = "bfree"
version = "0.1.14"
edition = "2024"
description = "bfree - memory stats for humans"
license = "MIT"
repository = "https://github.com/glexposito/bfree"
readme = "README.md"
keywords = ["memory", "linux", "cli", "system"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
procfs = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
rstest = "0.26"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

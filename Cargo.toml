[package]
name = "bfree"
version = "0.1.3"
edition = "2024"
description = "A better free, human by default"
license = "MIT"
repository = "https://github.com/glexposito/bfree"
readme = "README.md"
keywords = ["memory", "linux", "cli", "system"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

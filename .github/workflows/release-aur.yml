name: AUR Publish

on:
  workflow_call:
    inputs:
      version:
        description: Release version without v prefix
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        description: SSH private key for pushing to AUR
        required: true
      AUR_NAME:
        description: Git author name for AUR commit
        required: false
      AUR_EMAIL:
        description: Git author email for AUR commit
        required: false

jobs:
  publish_aur:
    name: AUR Publish
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH agent for AUR
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Add AUR host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/bfree.git aur-bfree

      - name: Update PKGBUILD and .SRCINFO
        working-directory: aur-bfree
        env:
          VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${VERSION}"
          SRC_URL="https://github.com/${GH_REPO}/archive/refs/tags/${TAG}.tar.gz"

          curl -L --fail -o source.tar.gz "${SRC_URL}"
          SHA256="$(sha256sum source.tar.gz | awk '{print $1}')"

          cat > PKGBUILD <<EOF2
          pkgname=bfree
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="A better free, human by default"
          arch=('x86_64')
          url="https://github.com/${GH_REPO}"
          license=('MIT')
          depends=('glibc')
          makedepends=('cargo')
          source=("${SRC_URL}")
          sha256sums=('${SHA256}')

          build() {
            cd "\${srcdir}/bfree-\${pkgver}"
            cargo build --release --locked
          }

          package() {
            cd "\${srcdir}/bfree-\${pkgver}"
            install -Dm755 target/release/bfree "\${pkgdir}/usr/bin/bfree"
            install -Dm644 README.md "\${pkgdir}/usr/share/doc/\${pkgname}/README.md"
          }
          EOF2

          cat > .SRCINFO <<EOF2
          pkgbase = bfree
            pkgdesc = A better free, human by default
            pkgver = ${VERSION}
            pkgrel = 1
            url = https://github.com/${GH_REPO}
            arch = x86_64
            license = MIT
            makedepends = cargo
            depends = glibc
            source = ${SRC_URL}
            sha256sums = ${SHA256}

          pkgname = bfree
          EOF2

      - name: Commit and push AUR changes
        working-directory: aur-bfree
        env:
          VERSION: ${{ inputs.version }}
          AUR_NAME: ${{ secrets.AUR_NAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          git config user.name "${AUR_NAME:-github-actions[bot]}"
          git config user.email "${AUR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No AUR metadata changes to push."
            exit 0
          fi
          git commit -m "release: v${VERSION}"
          git push
